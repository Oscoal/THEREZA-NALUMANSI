    <style>
        :root {
            /* Brand Colors based on the provided design */
            --primary: #1e3a8a; /* Deep navy */
            --primary-light: #3b5cbd; /* Lighter navy */
            --primary-dark: #172554; /* Darker navy */
            
            --accent: #d1fae5; /* Mint green bg */
            --accent-text: #059669; /* Mint green text */
            --accent-icon: #10b981; /* Mint green icon */
            
            /* UI Colors */
            --bg-color: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #475569;
            --white: #ffffff;
            --border: #e2e8f0;
            
            /* Gradient Background */
            --bg-gradient: linear-gradient(120deg, #f0fdf4 0%, #eff6ff 100%);
            
            /* Typography */
            --font-main: 'Inter', sans-serif;
            
            /* Spacing & Radii */
            --radius-sm: 8px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-full: 9999px;
            
            /* Layout */
            --max-width: 1280px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            background: var(--bg-gradient);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        ul {
            list-style: none;
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        /* Container */
        .container {
            width: 100%;
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Header */
        header {
            padding: 32px 0;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
        }

        .header-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            color: var(--primary);
            font-size: 1.125rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .logo-icon {
            font-size: 1.5rem;
        }

        .nav-links {
            display: flex;
            gap: 40px;
            font-weight: 500;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .nav-links a:hover {
            color: var(--primary);
            transition: color 0.3s ease;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 28px;
            border-radius: var(--radius-full);
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
        }

        .btn-primary {
            background-color: var(--primary);
            color: var(--white);
        }

        .btn-primary:hover {
            background-color: var(--primary-light);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .btn-secondary:hover {
            background-color: var(--primary);
            color: var(--white);
            transform: translateY(-2px);
        }

        /* Hero Section */
        .hero {
            padding-top: 160px;
            padding-bottom: 80px;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
        }

        .tag {
            display: inline-block;
            background-color: var(--accent);
            color: var(--accent-text);
            padding: 6px 16px;
            border-radius: var(--radius-full);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 24px;
        }

        .hero-title {
            font-size: 4.5rem;
            font-weight: 800;
            color: var(--primary);
            line-height: 1.1;
            margin-bottom: 24px;
            letter-spacing: -1px;
        }

        .hero-subtitle {
            font-size: 1.125rem;
            color: var(--text-muted);
            margin-bottom: 40px;
            max-width: 480px;
        }

        .hero-ctas {
            display: flex;
            gap: 16px;
            margin-bottom: 60px;
        }

        .stats-row {
            display: flex;
            gap: 48px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            color: var(--accent-icon);
        }

        .stat-icon svg {
            width: 24px;
            height: 24px;
        }

        .stat-value {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Hero Image Container */
        .hero-image-container {
            position: relative;
            border-radius: var(--radius-lg);
        }

        .hero-image {
            border-radius: var(--radius-lg);
            width: 100%;
            height: 600px;
            object-fit: cover;
            box-shadow: 0 20px 40px rgba(30, 58, 138, 0.1);
        }

        .floating-card {
            position: absolute;
            bottom: 40px;
            left: -40px;
            background-color: var(--white);
            padding: 24px;
            border-radius: var(--radius-md);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            display: flex;
            align-items: center;
            gap: 16px;
            width: calc(100% - 40px);
            max-width: 380px;
        }

        .floating-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--accent-icon);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            flex-shrink: 0;
        }

        .floating-icon svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .floating-text h4 {
            color: var(--primary);
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .floating-text p {
            color: var(--text-muted);
            font-size: 0.85rem;
            line-height: 1.4;
        }

        /* General Sections */
        .section {
            padding: 100px 0;
        }
